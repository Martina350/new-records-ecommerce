[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
