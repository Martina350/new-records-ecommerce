{% extends "base.html" %}

{% block titulo %}Inicio{% endblock %}

{% block contenido %}

  <main>
    <section class="inicio" aria-labelledby="titulo-inicio">
      <div class="inicio-fondo" role="img" aria-label="Vinilo iluminado en una tornamesa"></div>
      <div class="inicio-superposicion"></div>
      <div class="inicio-contenido">
        <h1 id="titulo-inicio" class="inicio-titulo">
          NEW <span class="degradado">RECORDS</span>
        </h1>
        <p class="inicio-descripcion">
          Nuestra tienda online es el destino definitivo para los amantes de la música. Encuentra los mejores discos de tus géneros favoritos.
        </p>
        <div class="inicio-botones">
          <a class="boton boton-destacado resplandor-neon" href="{{ url_for('categorias') }}">Explorar categorías</a>
        </div>
      </div>
    </section>
  </main>

{% endblock %}
